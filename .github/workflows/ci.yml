name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      REDIS_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run backend tests
        run: >-
          python -m pytest
          tests/test_menu_image_url.py
          tests/test_menu_query_rules.py
          tests/test_menu_retrieval_service.py
          tests/test_menu_taxonomy_filter.py
          tests/test_recommendation_criteria.py
          tests/test_cs_retrieval_service.py
          tests/test_retrieval_cache.py
          tests/test_graph_intent.py
          tests/test_graph_menu_followup.py
          tests/test_selected_order_session.py
          tests/test_streaming_manual_checkpoint.py
          tests/test_sse_error_stream.py
          tests/test_search_preview_api.py
          -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
